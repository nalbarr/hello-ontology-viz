[project]
name = "hello-ontology-viz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "owlready2>=0.51",
    "pillow>=11.0.0",
    "pydot>=3.0.4",
    "python-dotenv>=1.0.1",
    "rdflib>=7.6.0",
    "rustworkx>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_viz"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: slower tests, e.g. those requiring the OWL reasoner (Java)",
]
